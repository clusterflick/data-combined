on:
  workflow_dispatch:
  repository_dispatch:
    types: [release_event]

name: Combine Data

permissions:
  contents: read

jobs:
  combine_data:
    name: Combine and Release
    runs-on: ubuntu-latest
    # ncipollo/release-action creates a release + tag via GITHUB_TOKEN,
    # which requires contents: write (top-level default is contents: read).
    permissions:
      contents: write
    env:
      MOVIEDB_API_KEY: ${{ secrets.MOVIEDB_API_KEY }}
    steps:
      - uses: clusterflick/.github/setup@main
      - name: Download cached data
        uses: clusterflick/release-downloader@v2
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-cached"
          latest: true
          fileName: "*"
          out-file-path: "cached-data"
      - name: Download transformed data
        uses: clusterflick/release-downloader@v2
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-transformed"
          latest: true
          fileName: "*"
          out-file-path: "transformed-data"

      - name: Download seen registry
        continue-on-error: true
        uses: clusterflick/release-downloader@v2
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-diffed"
          latest: true
          fileName: "seen-registry.json"
          out-file-path: "diffed-data"

      - name: Combine Data
        run: npm run combine
        env:
          PAT: ${{ secrets.PAT }}

      # Runs after combine and reads its output: departed movies are the ones
      # the registry knows about that combine did not produce. Writes a separate
      # artifact, leaving combined-data.json untouched.
      - name: Build Departed Movies
        run: npm run departed

      - name: Generate Tag
        run: echo "TAG=$(TZ=Europe/London date +'%Y%m%d.%H%M%S')" >> $GITHUB_ENV
      - uses: ncipollo/release-action@v1
        id: release
        with:
          allowUpdates: false
          artifactErrorsFailBuild: true
          artifacts: "combined-data/*"
          makeLatest: true
          tag: ${{ env.TAG }}
          commit: main
          body: |
            Created by job ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Output summary
        run: |
          echo "🔖 New release - ${{ steps.release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY

      - name: Repository Dispatch for data-matched
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: clusterflick/data-matched
          event-type: release_event

      - name: Repository Dispatch for clusterflick.com
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: clusterflick/clusterflick.com
          event-type: release_event

      - name: Repository Dispatch for analysis.clusterflick.com
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: clusterflick/analysis.clusterflick.com
          event-type: release_event
